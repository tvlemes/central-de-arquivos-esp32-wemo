[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags = 
	-DCORE_DEBUG_LEVEL=0

; Biblioteca de Audio    
lib_deps = esphome/ESP32-audioI2S@^2.3.0

; Novo particionamento para aumentar a capacidade da memória flash
board_build.partitions = huge_app.csv

; Frequência da CPU
board_build.f_cpu = 240000000L